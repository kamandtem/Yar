name: Build Yar Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
    group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing - web build failed"; exit 1; }
          ls -lah dist/

      - name: Add android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present, skipping add"
          fi

      - name: Sync capacitor
        run: npx cap sync android

      - name: Generate app icons and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Patch Android project (app name, status bar)
        run: node scripts/patch-android.mjs

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing YAR_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > yar-release.jks
          test -s yar-release.jks || { echo "::error::Keystore is empty"; exit 1; }

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YAR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YAR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing YAR_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing YAR_KEY_PASSWORD"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/yar-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="${{ secrets.YAR_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        run: |
          find android -name "*.apk" -type f -print
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: yar-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing files
        if: always()
        run: rm -f yar-release.jks

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
