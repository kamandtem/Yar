name: Build Yar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing - web build failed"; exit 1; }
          ls -lah dist/

      - name: Add android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present, skipping add"
          fi

      - name: Sync capacitor
        run: npx cap sync android

      - name: Generate app icons and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Patch Android project (app name, status bar)
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        run: |
          find android -name "*.apk" -type f -print
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
