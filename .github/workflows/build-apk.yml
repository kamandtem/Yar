      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools: '34.0.0'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

      - name: Verify build output
        run: ls -lah dist/

      - name: Create Android project
        run: |
          echo "Creating Android project via Capacitor..."
          npx cap add android
          ls -lah android/

      - name: Generate app icons and assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Verify Android project structure
        run: |
          echo "Checking Android structure..."
          ls -lah android/
          ls -lah android/app/
          ls -lah android/app/build/ 2>/dev/null || echo "Build dir not yet created"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --info

      - name: Verify APK output
        run: |
          echo "Checking for built APK..."
          find android -name "*.apk" -type f
          ls -lah android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK directory not found!"

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Generate build summary
        if: always()
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "Workspace contents:"
          ls -lah
          echo ""
          echo "Android directory:"
          ls -lah android/ 2>/dev/null || echo "Android directory missing!"
          echo ""
          echo "APK outputs:"
          find android -name "*.apk" 2>/dev/null || echo "No APK files found"
