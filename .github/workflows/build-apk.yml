name: Build Yar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '35'
          build-tools: '35.0.0'
          ndk-version: '27.0.12077973'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify dist output
        run: |
          echo "Checking dist folder..."
          ls -lah dist/
          find dist -type f | wc -l

      - name: Add android platform
        run: |
          echo "Adding Android platform to Capacitor..."
          npx cap add android --web-dir=dist

      - name: Generate capacitor assets
        run: |
          echo "Generating app icons and splash screen..."
          npx capacitor-assets generate --android

      - name: Sync capacitor plugins
        run: |
          echo "Syncing Capacitor with Android..."
          npx cap sync android

      - name: List android directory
        run: |
          echo "Android directory contents:"
          ls -la android/
          ls -la android/app/
          ls -la android/app/build.gradle* 2>/dev/null || echo "gradle files not yet generated"

      - name: Build APK with gradle
        run: |
          cd android
          chmod +x gradlew
          echo "Running gradle clean..."
          ./gradlew clean --info
          echo "Building debug APK..."
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee build.log
          echo "Build completed"

      - name: Check gradle output directory
        run: |
          echo "Searching for APK files..."
          find android -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "Full build output directory:"
          find android/app/build -type d -name outputs 2>/dev/null | head -5

      - name: List all APK locations
        run: |
          echo "All APK locations in project:"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "Expected path: android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory does not exist"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Final status
        if: always()
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "Workspace:"
          ls -la
          echo ""
          echo "Android app module:"
          ls -la android/app/ 2>/dev/null || echo "android/app not found"
          echo ""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK BUILT SUCCESSFULLY"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK NOT FOUND"
            echo "Contents of android/app/build/:"
            ls -la android/app/build/ 2>/dev/null || echo "Build directory missing"
          fi
