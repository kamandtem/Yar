name: Build Yar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '35'
          build-tools: '35.0.0'
          ndk-version: '27.0.12077973'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify dist output
        run: |
          echo "Checking dist folder..."
          ls -lah dist/
          find dist -type f | wc -l

      - name: Add android platform
        run: |
          echo "Adding Android platform to Capacitor..."
          npx cap add android --web-dir=dist

      - name: Generate capacitor assets
        run: |
          echo "Generating app icons and splash screen..."
          npx capacitor-assets generate --android

      - name: Sync capacitor plugins
        run: |
          echo "Syncing Capacitor with Android..."
          npx cap sync android

      - name: Build APK with gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "Searching for APK..."
          find android -name "*.apk" -type f

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build status
        if: always()
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK BUILT"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK NOT FOUND"
          fi
