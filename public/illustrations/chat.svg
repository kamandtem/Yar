<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ddd0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#chatBg)"/>
  
  <!-- پیام اول (چپ) -->
  <rect x="40" y="80" width="200" height="50" rx="15" fill="#6b9ac1"/>
  <text x="50" y="110" font-family="Arial" font-size="14" fill="white" font-weight="bold">سلام، می‌تونی</text>
  <text x="50" y="125" font-family="Arial" font-size="14" fill="white" font-weight="bold">احساسات خودت رو بگی؟</text>
  
  <!-- پیام دوم (راست) -->
  <rect x="160" y="160" width="200" height="50" rx="15" fill="#f4a9a1"/>
  <text x="170" y="190" font-family="Arial" font-size="14" fill="white" font-weight="bold">البته! خیلی</text>
  <text x="170" y="205" font-family="Arial" font-size="14" fill="white" font-weight="bold">می‌خواستم این رو بگم.</text>
  
  <!-- پیام سوم (چپ) -->
  <rect x="40" y="240" width="200" height="60" rx="15" fill="#6b9ac1"/>
  <text x="50" y="265" font-family="Arial" font-size="14" fill="white" font-weight="bold">دوست دارم با تو</text>
  <text x="50" y="280" font-family="Arial" font-size="14" fill="white" font-weight="bold">راستِ صحبت کنم.</text>
  <text x="50" y="295" font-family="Arial" font-size="14" fill="white" font-weight="bold">تو برای من مهم‌تری.</text>
  
  <!-- نقطه‌های typing -->
  <circle cx="50" cy="330" r="4" fill="#999"/>
  <circle cx="62" cy="330" r="4" fill="#999"/>
  <circle cx="74" cy="330" r="4" fill="#999"/>
</svg>
