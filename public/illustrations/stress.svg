<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe8e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd9cf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#heartBg)"/>
  
  <!-- قلب بزرگ -->
  <path d="M 200 320 C 140 260 100 220 100 160 C 100 120 130 90 160 90 C 180 90 200 100 200 100 C 200 100 220 90 240 90 C 270 90 300 120 300 160 C 300 220 260 260 200 320 Z" 
        fill="#e74c3c" opacity="0.8"/>
  
  <!-- دایره‌های نفر -->
  <circle cx="120" cy="80" r="35" fill="#6b9ac1" opacity="0.8"/>
  <circle cx="280" cy="80" r="35" fill="#f4a9a1" opacity="0.8"/>
  
  <!-- متن داخل دایره‌ها -->
  <text x="120" y="95" font-family="Arial" font-size="40" text-anchor="middle" fill="white">👨</text>
  <text x="280" y="95" font-family="Arial" font-size="40" text-anchor="middle" fill="white">👩</text>
  
  <!-- شاخه -->
  <path d="M 200 320 Q 210 340 210 360" stroke="#2ecc71" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="215" cy="350" rx="8" ry="12" fill="#2ecc71"/>
  <ellipse cx="210" cy="365" rx="6" ry="10" fill="#2ecc71"/>
</svg>
